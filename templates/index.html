<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>歌曲推薦系統</title>
    <link rel="stylesheet" href="/static/style.css">  <style>
        /* 你也可以先將 CSS 放在這裡測試 */
        /* CSS 內容見下方 */
    </style>
</head>
<body>
    <div class="moodplay-container">
        <header class="moodplay-header">
            <h1>Mood<span class="play-icon">▶</span>PLAY</h1>
            <p class="subtitle"><span class="headphone-icon">🎧</span> Build your vibe. One mood at a time.</p>
        </header>

        <div class="music-visualizer-wrapper">
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
            <div class="visualizer-bar"></div>
        </div>

        <div class="controls-wrapper">
            <div class="select-group-styled">
                <div class="select-control">
                    <label for="mood" class="select-label-styled">心情</label>
                    <select id="mood" class="styled-select">
                        <option value="">選擇心情</option>
                        </select>
                </div>
                <div class="select-control">
                    <label for="time" class="select-label-styled">時段</label>
                    <select id="time" class="styled-select">
                        <option value="">選擇時段</option>
                        </select>
                </div>
                <div class="select-control">
                    <label for="activity" class="select-label-styled">活動</label>
                    <select id="activity" class="styled-select">
                        <option value="">選擇活動</option>
                        </select>
                </div>
            </div>

            <textarea class="output-box-styled" id="output-box" readonly>請選擇條件查詢歌曲</textarea>

            <div class="btn-group-styled">
                <button type="button" id="recommend-btn" class="styled-button recommend">推薦</button>
                <button type="button" id="exit-btn" class="styled-button exit">結束</button>
            </div>
             <div class="warning-text-styled">
                若是沒有打開正確數量的網頁，請回到本網頁並允許網頁打開多個網頁。
            </div>
        </div>

    </div>

    <div class="sidebar" id="sidebar">
        <div class="recommendation-intro-text">為您推薦以下歌曲：</div>
        <div id="song-playlist-container">
            <ul id="song-playlist">
            </ul>
        </div>
    </div>

    <script src="/static/scripts.js"></script>
    <script>
        // 你現有的 scripts.js 應該能繼續工作，
        // 主要是動態填充下拉選單和處理按鈕事件。
        // 如果 CSS 修改了 ID 或 Class，可能需要同步調整。
        // Gemini 相關的 JS 可以暫時移除或註解掉，因為 AI 功能先不添加。
        // 例如，移除或註解掉 index.html 中 Gemini 相關的 <script> 內容和按鈕的 HTML
    </script>
    </body>
</html>
